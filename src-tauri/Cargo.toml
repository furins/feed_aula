[package]
name = "feed_aula"
version = "0.1.0"
description = "FEED - feedback formativo in aula"
edition = "2021"
rust-version = "1.88"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
rusqlite = { version = "0.40.1", features = [
    "bundled-sqlcipher-vendored-openssl",
] }
aes-gcm = "0.11.0"
argon2 = "0.5.3"
base64 = "0.22.1"
getrandom = "0.4.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
zeroize = "1.9.0"

[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = { version = "=2.0.2", features = ["v2_24"] }
